- name: Run checkin
        if: ${{ steps.decision.outputs.should_run == 'yes' }}
        id: run
        shell: bash
        env:
          IKUUU_COOKIES: ${{ secrets.IKUUU_COOKIES }}
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          IKUUU_BASE_URL: ${{ vars.IKUUU_BASE_URL }}
          RETRY: ${{ vars.RETRY }}
          RETRY_DELAY: ${{ vars.RETRY_DELAY }}
          CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT }}
          MAX_TIME: ${{ vars.MAX_TIME }}
        run: |
          set -euo pipefail
          RETRY="${RETRY:-2}"; RETRY_DELAY="${RETRY_DELAY:-2}"; CONNECT_TIMEOUT="${CONNECT_TIMEOUT:-10}"; MAX_TIME="${MAX_TIME:-30}"
          BASE="${IKUUU_BASE_URL:-https://ikuuu.co}"; BASE="${BASE%/}"
          if [ -n "${IKUUU_COOKIES:-}" ]; then COOKIES=$(printf '\%s\n' "$IKUUU_COOKIES");
          elif [ -n "${IKUUU_COOKIE:-}" ]; then COOKIES=$(printf '\%s\n' "$IKUUU_COOKIE");
          else echo "overall_status=failed" >> "$GITHUB_OUTPUT"; echo "summary=No cookie configured" >> "$GITHUB_OUTPUT"; exit 0; fi

          [ -n "${IKUUU_COOKIE:-}" ] && echo "::add-mask::${IKUUU_COOKIE}"
          [ -n "${IKUUU_COOKIES:-}" ] && echo "::add-mask::${IKUUU_COOKIES}"

          normalized=$(printf '\%s\n' "$COOKIES" \
            | tr -d '\r' \
            | awk 'BEGIN{RS=""; ORS="\n"} {gsub(/\n+/, " "); gsub(/[ \t]+/, " "); print}')
          mapfile -t COOKIE_LINES < <(printf '%s\n' "$normalized" \vert{} sed '/^[[:space:]]*$/d')
          OK=0; FAIL=0; DETAILS=()

          sanitize_msg() {
            local in="$1" out
            out=$(printf '\%s' "$in" | sed -E \
              -e 's/[A-Za-z0-9._%+-]+%40[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***%40***/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g' \
              -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/***.***.***.***/g' \
              -e 's/[A-Fa-f0-9]{32,}/[MASKED_HEX]/g' \
              -e 's/uid=[0-9]+/uid=****/g' \
              -e 's/key=[^ ;]+/key=****/g' \
              -e 's/ip=[^ ;]+/ip=****/g' \
              -e 's/expire_in=[0-9]+/expire_in=****/g')
            printf '%s' "$out"
          }

          # 提取 /user 页面中的流量统计信息
          fetch_traffic_info() {
            local ck="$1"
            local html
            html=$(curl -sS "${BASE}/user" \
              -H 'user-agent: Mozilla/5.0' \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$MAX_TIME" \
              -b "$ck" 2>/dev/null || printf '')
            
            python3 -c '
import sys, re

html = sys.stdin.read()
if not html:
    print("未知")
    sys.exit(0)

# 匹配常见的 SSPanel 流量模版文本（如：今日已用 / 剩余流量 / 账户总流量 等）
# 模式1: 剩余: xx GB / 总计: xx GB
total_match = re.search(r"(?:等级过期|总流量|等级流量|账户流量)[^<0-9]*([0-9.]+\s*(?:MB|GB|TB|KB))", html, re.I)
remain_match = re.search(r"(?:剩余流量|剩余)[^<0-9]*([0-9.]+\s*(?:MB|GB|TB|KB))", html, re.I)
used_match = re.search(r"(?:已用流量|今日已用|已用)[^<0-9]*([0-9.]+\s*(?:MB|GB|TB|KB))", html, re.I)

res = []
if remain_match:
    res.append(f"剩余: {remain_match.group(1)}")
if total_match:
    res.append(f"总计: {total_match.group(1)}")
elif used_match:
    res.append(f"已用: {used_match.group(1)}")

print(" | ".join(res) if res else "获取成功(格式未匹配)")
' <<<"$html"
          }

          check_one() {
            local ck="$1" idx="$2" http='' curl_code=0 RESP MSG RET tmpf
            
            # 1. 签到前获取当前流量
            local traffic_before
            traffic_before=$(fetch_traffic_info "$ck")

            tmpf=$(mktemp)
            set +e
            http=$(curl -sS "${BASE}/user/checkin" \
              -X POST \
              -H 'accept: application/json, text/javascript, */*; q=0.01' \
              -H 'x-requested-with: XMLHttpRequest' \
              -H "origin: ${BASE}" \
              -H "referer: ${BASE}/user" \
              -H 'user-agent: Mozilla/5.0' \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$MAX_TIME" \
              --retry "$RETRY" --retry-delay "$RETRY_DELAY" --retry-all-errors \
              -b "$ck" -o "$tmpf" -w '%{http_code}')
            curl_code=$?
            set -e
            RESP=$(cat "$tmpf" 2>/dev/null || printf '{}')
            rm -f "$tmpf"

            RET=$(python3 -c 'import json,sys; s=sys.stdin.read(); print(json.loads(s).get("ret",0) if s.strip().startswith("{") else 0)' <<<"$RESP")
            MSG=$(python3 -c 'import json,sys,re; s=sys.stdin.read(); isj=s.strip().startswith("{"); msg可以实现。SSPanel（Ikuuu 所用的面板系统）的 `/user/checkin` 接口通常只返回本次签到获得的流量或签到状态，**不会返回账号当前的剩余/总流量**。

要获取签到前后的总流量与剩余流量，需要在签到前后分别向 `/user` 用户中心页面发起一次 `GET` 请求，抓取 HTML 中的流量统计数据。

---

### 修改方案

在 `Run checkin` 步骤中增加一个解析 `/user` 页面的 Python 函数，并在执行 `check_one` 时记录签到前后的流量。

#### 1. 核心解析逻辑
SSPanel 的 `/user` 页面通常包含以下字段（或通过正则匹配文本）：
* **今日已用 / 过去已用**
* **剩余流量 / 总流量**（例如 `剩余: 12.34 GB`, `总计: 50.00 GB`）

#### 2. 修改后的 `check_one` 脚本代码
将 workflow 中的 `Run checkin` 步骤的 `run` 部分替换为以下增强逻辑：

```bash
          set -euo pipefail
          RETRY="${RETRY:-2}"; RETRY_DELAY="${RETRY_DELAY:-2}"; CONNECT_TIMEOUT="${CONNECT_TIMEOUT:-10}"; MAX_TIME="${MAX_TIME:-30}"
          BASE="${IKUUU_BASE_URL:-[https://ikuuu.co](https://ikuuu.co)}"; BASE="${BASE%/}"
          if [ -n "${IKUUU_COOKIES:-}" ]; then COOKIES=$(printf '%s\n' "$IKUUU_COOKIES");
          elif [ -n "${IKUUU_COOKIE:-}" ]; then COOKIES=$(printf '%s\n' "$IKUUU_COOKIE");
          else echo "overall_status=failed" >> "$GITHUB_OUTPUT"; echo "summary=No cookie configured" >> "$GITHUB_OUTPUT"; exit 0; fi
          
          [ -n "${IKUUU_COOKIE:-}" ] && echo "::add-mask::${IKUUU_COOKIE}"
          [ -n "${IKUUU_COOKIES:-}" ] && echo "::add-mask::${IKUUU_COOKIES}"
          
          normalized=$(printf '%s\n' "$COOKIES" \
            | tr -d '\r' \
            | awk 'BEGIN{RS=""; ORS="\n"} {gsub(/\n+/, " "); gsub(/[ \t]+/, " "); print}')
          mapfile -t COOKIE_LINES < <(printf '%s\n' "$normalized" | sed '/^[[:space:]]*$/d')
          
          OK=0; FAIL=0; DETAILS=()

          # 从 /user 页面抓取流量信息
          fetch_traffic() {
            local ck="$1"
            local html
            html=$(curl -sS "${BASE}/user" \
              -H 'user-agent: Mozilla/5.0' \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$MAX_TIME" \
              -b "$ck" 2>/dev/null || printf '')
            
            python3 -c '
import sys, re
html = sys.stdin.read()
# 匹配面板常见的流量格式（如：总流量 50.00 GB，剩余流量 45.20 GB）
total = re.search(r"总[计共]?流量[^\d]*([\d\.]+\s*[KMGTP]?B)", html, re.I)
unused = re.search(r"剩余流量[^\d]*([\d\.]+\s*[KMGTP]?B)", html, re.I)

t_str = total.group(1) if total else "未知"
u_str = unused.group(1) if unused else "未知"

if t_str != "未知" or u_str != "未知":
    print(f"剩余: {u_str} / 总计: {t_str}")
else:
    print("未能解析流量")
' <<< "$html"
          }

          sanitize_msg() {
            local in="$1" out
            out=$(printf '%s' "$in" | sed -E \
              -e 's/[A-Za-z0-9._%+-]+%40[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***%40***/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g' \
              -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/***.***.***.***/g' \
              -e 's/[A-Fa-f0-9]{32,}/[MASKED_HEX]/g' \
              -e 's/uid=[0-9]+/uid=****/g' \
              -e 's/key=[^ ;]+/key=****/g' \
              -e 's/ip=[^ ;]+/ip=****/g' \
              -e 's/expire_in=[0-9]+/expire_in=****/g')
            printf '%s' "$out"
          }

          check_one() {
            local ck="$1" idx="$2" http='' curl_code=0 RESP MSG RET tmpf
            
            # 1. 签到前查询流量
            TRAFFIC_BEFORE=$(fetch_traffic "$ck")

            # 2. 执行签到
            tmpf=$(mktemp)
            set +e
            http=$(curl -sS "${BASE}/user/checkin" \
              -X POST \
              -H 'accept: application/json, text/javascript, */*; q=0.01' \
              -H 'x-requested-with: XMLHttpRequest' \
              -H "origin: ${BASE}" \
              -H "referer: ${BASE}/user" \
              -H 'user-agent: Mozilla/5.0' \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$MAX_TIME" \
              --retry "$RETRY" --retry-delay "$RETRY_DELAY" --retry-all-errors \
              -b "$ck" -o "$tmpf" -w '%{http_code}')
            curl_code=$?
            set -e
            RESP=$(cat "$tmpf" 2>/dev/null || printf '{}')
            rm -f "$tmpf"

            RET=$(python3 -c 'import json,sys; s=sys.stdin.read(); print(json.loads(s).get("ret",0) if s.strip().startswith("{") else 0)' <<<"$RESP")
            MSG=$(python3 -c 'import json,sys,re; s=sys.stdin.read(); isj=s.strip().startswith("{"); msg=str(json.loads(s).get("msg","")) if isj else re.sub(r"\s+"," ",s).strip()[:120]; print(msg.replace("\n"," ").strip())' <<<"$RESP")
            MSG=$(sanitize_msg "$MSG")

            # 3. 签到后查询流量
            TRAFFIC_AFTER=$(fetch_traffic "$ck")

            local is_success=0
            local failure_reason=""

            if [ "$http" != "200" ]; then
              failure_reason="HTTP ${http}"
            elif [ "$curl_code" -ne 0 ]; then
              failure_reason="curl_code=${curl_code}"
            elif printf '%s' "$MSG" | grep -Eiq '登录|login|失效|过期|expired|invalid|unauthorized|token|认证|auth'; then
              failure_reason="Cookie可能失效: ${MSG}"
            elif [ -z "$MSG" ] || [ "$MSG" = "{}" ]; then
              failure_reason="空响应或无效响应"
            elif [ "$RET" = "1" ] && printf '%s' "$MSG" | grep -Eq 'MB|GB|流量|traffic'; then
              is_success=1
            elif printf '%s' "$MSG" | grep -Eq '已签到|已经签到|似乎已经签到|checked.*today'; then
              is_success=1
            elif [ "$RET" != "1" ]; then
              failure_reason="ret=${RET}, 未获得流量"
            else
              failure_reason="返回ret=1但无流量信息，疑似Cookie失效"
            fi

            # 拼接展示内容：包含前/后流量
            local traffic_info="[前: ${TRAFFIC_BEFORE} -> 后: ${TRAFFIC_AFTER}]"
            if [ "$is_success" -eq 1 ]; then
              OK=$((OK+1))
              DETAILS+=("[#${idx}] OK ${MSG} | ${traffic_info}")
            else
              FAIL=$((FAIL+1))
              if [ -n "$failure_reason" ]; then
                DETAILS+=("[#${idx}] FAIL ${failure_reason} | ${traffic_info}")
              else
                DETAILS+=("[#${idx}] FAIL ret=${RET} http=${http} ${MSG} | ${traffic_info}")
              fi
            fi
          }

          i=0; for ck in "${COOKIE_LINES[@]}"; do i=$((i+1)); check_one "$ck" "$i"; done
          TOTAL=$((OK+FAIL))
          if [ "$TOTAL" -eq 0 ]; then STATUS=failed; SUMMARY="No valid cookie"; elif [ "$FAIL" -gt 0 ]; then STATUS=failed; SUMMARY="${OK} ok, ${FAIL} fail"; else STATUS=success; SUMMARY="All ${OK} accounts success"; fi
          echo "overall_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          
          {
            echo "# Ikuuu Checkin"
            echo "- status: $STATUS"
            echo "- ok: $OK"
            echo "- fail: $FAIL"
            echo
            echo "| # | result | message |"
            echo "|---:|:---:|:---|"
            idx=0
            for d in "${DETAILS[@]}"; do idx=$((idx+1)); r=$(printf '%s' "$d" | awk '{print $2}'); m=$(printf '%s' "$d" | cut -d' ' -f3-); echo "| $idx | $r | $m |"; done
          } >> "$GITHUB_STEP_SUMMARY"
