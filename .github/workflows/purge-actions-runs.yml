name: Purge Actions Runs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 DELETE 以确认清除（默认已填）"
        required: true
        default: "DELETE"

permissions:
  contents: read
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow runs in this repo (except this run)
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const { owner, repo } = context.repo;
            const selfRunId = Number(process.env.GITHUB_RUN_ID);
            const confirm = core.getInput('confirm');
            if (confirm !== 'DELETE') {
              core.setFailed('确认值不是 DELETE，已取消。');
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100,
            });

            let deleted = 0, skipped = 0, failed = 0;
            for (const r of runs) {
              if (r.id === selfRunId) { skipped++; continue; }
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                deleted++;
              } catch (e) {
                // 无法删除进行中的运行等，忽略
                skipped++;
              }
            }

            core.summary
              .addHeading('Purge Actions Runs')
              .addRaw(`deleted: ${deleted}, skipped: ${skipped}, self: ${selfRunId}`)
              .write();

            core.info(`deleted=${deleted} skipped=${skipped}`);
            
      - name: Tip to remove this workflow itself
        run: |
          echo "清理完成：若想不留任何运行记录，可在本次运行结束后，手动删除这一条运行记录；" \
               "随后删除 .github/workflows/purge-actions-runs.yml 文件。"

